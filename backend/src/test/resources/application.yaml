spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

app:
  security:
    max-failed-attempts: 5
    lock-time-duration: 5
    jwt:
      secret: testSecretKeyForTestingPurposesOnlyMustBeAtLeast256BitsLongForHS256Algorithm
