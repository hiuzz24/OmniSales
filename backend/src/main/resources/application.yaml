server:
  port: 8080
spring:
  application:
    name: OSMS
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:OSMS}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none  # TẮT Hibernate DDL mặc định — schema do SQL script tạo.
    properties:
      hibernate:
        # Hardcode dialect để tránh "Unable to determine Dialect" khi DB env
        # chưa được Render inject (vd: sau khi delete DB, env vẫn còn host cũ).
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Cấu hình RabbitMQ cho các luồng đồng bộ (webhook, push inventory/product)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:osms}
    password: ${RABBITMQ_PASSWORD:osms}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3000}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTOSTART:true}
        retry:
          enabled: ${RABBITMQ_LISTENER_RETRY_ENABLED:true}
          max-attempts: ${RABBITMQ_LISTENER_MAX_ATTEMPTS:5}
          initial-interval: 1s
          multiplier: 2
          max-interval: 30s
    template:
      retry:
        enabled: ${RABBITMQ_TEMPLATE_RETRY_ENABLED:true}
        max-attempts: ${RABBITMQ_TEMPLATE_MAX_ATTEMPTS:3}
        initial-interval: 500ms
        multiplier: 2
        max-interval: 5s

  # Cấu hình SMTP Server cho Gmail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection timeout: 5000
          timeout: 5000
          write timeout: 5000

# OpenAPI / Swagger UI: spec nội bộ auto-generate + spec tĩnh của các sàn
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    urls:
      - name: OSMS Internal API
        url: /v3/api-docs
      - name: Lazada API
        url: /openapi/lazada.yaml
      - name: TikTok Shop API
        url: /openapi/tiktok.yaml
      - name: Shopify Admin API
        url: /openapi/shopify.yaml
      - name: RestCountries API
        url: /openapi/rest-countries.yaml

app:
  admin:
    migration-key: ${ADMIN_MIGRATION_KEY:}  # Set on Render to enable /api/admin/run-migrations/**. Delete after migration.
  messaging:
    mode: ${APP_MESSAGING_MODE:broker}
  inventory-extra-import:
    fuzzy-threshold: ${INVENTORY_EXTRA_IMPORT_FUZZY_THRESHOLD:0.4}
    error-directory: ${INVENTORY_EXTRA_IMPORT_ERROR_DIRECTORY:${java.io.tmpdir}/osms/inventory-extra-import-errors}
  webhook-retry:
    enabled: ${WEBHOOK_RETRY_ENABLED:true}
    fixed-delay-ms: ${WEBHOOK_RETRY_FIXED_DELAY_MS:30000}
    stuck-after-ms: ${WEBHOOK_RETRY_STUCK_AFTER_MS:120000}
    max-retries: ${WEBHOOK_RETRY_MAX_RETRIES:3}
    batch-size: ${WEBHOOK_RETRY_BATCH_SIZE:50}
  order-pull-recovery:
    enabled: ${ORDER_PULL_RECOVERY_ENABLED:true}
    fixed-delay-ms: ${ORDER_PULL_RECOVERY_FIXED_DELAY_MS:30000}
    published-stale-ms: ${ORDER_PULL_RECOVERY_PUBLISHED_STALE_MS:120000}
    processing-stale-ms: ${ORDER_PULL_RECOVERY_PROCESSING_STALE_MS:1800000}
    max-attempts: ${ORDER_PULL_RECOVERY_MAX_ATTEMPTS:3}
    batch-size: ${ORDER_PULL_RECOVERY_BATCH_SIZE:20}
  async:
    order-pull:
      core-size: ${ASYNC_ORDER_PULL_CORE_SIZE:2}
      max-size: ${ASYNC_ORDER_PULL_MAX_SIZE:6}
      queue-capacity: ${ASYNC_ORDER_PULL_QUEUE_CAPACITY:50}
    sync-job:
      core-size: ${ASYNC_SYNC_JOB_CORE_SIZE:4}
      max-size: ${ASYNC_SYNC_JOB_MAX_SIZE:8}
      queue-capacity: ${ASYNC_SYNC_JOB_QUEUE_CAPACITY:100}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    lazada-requests-per-minute: ${RATE_LIMIT_LAZADA_RPM:100}
    tiktok-requests-per-minute: ${RATE_LIMIT_TIKTOK_RPM:100}
    shopify-requests-per-minute: ${RATE_LIMIT_SHOPIFY_RPM:120}
  inventory-reconciliation:
    enabled: ${INVENTORY_RECONCILIATION_ENABLED:true}
    fixed-delay-ms: ${INVENTORY_RECONCILIATION_FIXED_DELAY_MS:5000}
    debounce-ms: ${INVENTORY_RECONCILIATION_DEBOUNCE_MS:10000}
    verification-delay-ms: ${INVENTORY_RECONCILIATION_VERIFY_DELAY_MS:10000}
    processing-timeout-ms: ${INVENTORY_RECONCILIATION_PROCESSING_TIMEOUT_MS:120000}
    batch-size: ${INVENTORY_RECONCILIATION_BATCH_SIZE:100}
    max-api-attempts: ${INVENTORY_RECONCILIATION_MAX_API_ATTEMPTS:3}
  channel-token-refresh:
    enabled: ${CHANNEL_TOKEN_REFRESH_ENABLED:true}
    fixed-delay-ms: ${CHANNEL_TOKEN_REFRESH_FIXED_DELAY_MS:600000}
    refresh-before-minutes: ${CHANNEL_TOKEN_REFRESH_BEFORE_MINUTES:30}
  notifications:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    low-stock-repeat-hours: ${LOW_STOCK_NOTIFICATION_REPEAT_HOURS:12}
    low-stock-reminder-ms: ${LOW_STOCK_NOTIFICATION_REMINDER_MS:43200000}
    low-stock-reminder-initial-delay-ms: ${LOW_STOCK_NOTIFICATION_REMINDER_INITIAL_DELAY_MS:43200000}
  security:
    max-failed-attempts: 5
    lock-time-duration: 5
    jwt:
      secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL:http://localhost:5174}

shopify:
  api-key: ${SHOPIFY_API_KEY:}
  api-secret: ${SHOPIFY_API_SECRET:}
  redirect-uri: ${SHOPIFY_REDIRECT_URI:}
  scopes: ${SHOPIFY_SCOPES:}
  webhook-callback-url: ${SHOPIFY_WEBHOOK_CALLBACK_URL:}


rest-countries:
    api-key: ${REST_COUNTRIES_API_KEY}

lazada:
  app-key: ${LAZADA_APP_KEY:}
  app-secret: ${LAZADA_APP_SECRET:}
  redirect-uri: ${LAZADA_REDIRECT_URI:}
  webhook-callback-url: ${LAZADA_WEBHOOK_CALLBACK_URL:}
  api-url: https://api.lazada.vn/rest
  auth-api-url: https://auth.lazada.com/rest
  auth-url: https://auth.lazada.com/oauth/authorize
  default-package-weight: 0.5
  default-package-length: 20
  default-package-width: 15
  default-package-height: 5
  fashion-root-category-ids: ${LAZADA_FASHION_ROOT_CATEGORY_IDS:}
  order:
    delivery-type: ${LAZADA_ORDER_DELIVERY_TYPE:dropship}
    shipping-allocate-type: ${LAZADA_ORDER_SHIPPING_ALLOCATE_TYPE:TFS}

tiktok:
  app-key: ${TIKTOK_APP_KEY:}
  app-secret: ${TIKTOK_APP_SECRET:}
  token-url: ${TIKTOK_TOKEN_URL:https://auth.tiktok-shops.com/api/v2/token/get}
  refresh-token-url: ${TIKTOK_REFRESH_TOKEN_URL:https://auth.tiktok-shops.com/api/v2/token/refresh}
  api-url: ${TIKTOK_API_URL:https://open-api.tiktokglobalshop.com}
  fashion-root-category-ids: "${TIKTOK_FASHION_ROOT_CATEGORY_IDS:601152,824328,802312,803592,601303,877320,834568,846224}"
  product-api-version: ${TIKTOK_PRODUCT_API_VERSION:202502}
  product-detail-api-version: ${TIKTOK_PRODUCT_DETAIL_API_VERSION:202309}
