server:
  port: 8080
spring:
  application:
    name: OSMS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/OSMS}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

app:
  security:
    max-failed-attempts: 5
    lock-time-duration: 5
    jwt:
      secret: ${JWT_SECRET}
