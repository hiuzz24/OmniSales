server:
  port: 8080
spring:
  application:
    name: OSMS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/OSMS}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection timeout: 5000
          timeout: 5000
          write timeout: 5000

app:
  security:
    max-failed-attempts: 5
    lock-time-duration: 5
    jwt:
      secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL:http://localhost:5174}

shopify:
  api-key: ${SHOPIFY_API_KEY:}
  api-secret: ${SHOPIFY_API_SECRET:}
  redirect-uri: ${SHOPIFY_REDIRECT_URI:}
  scopes: ${SHOPIFY_SCOPES:write_products,read_products,write_inventory,read_inventory,read_orders,write_orders}
