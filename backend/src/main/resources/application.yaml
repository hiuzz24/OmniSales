server:
  port: 8080
spring:
  application:
    name: OSMS
  datasource:
    url: jdbc:postgresql://localhost:5432/OSMS
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Cấu hình SMTP Server cho Gmail (Đã chuyển về đúng nhóm spring)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection timeout: 5000
          timeout: 5000
          write timeout: 5000

app:
  notifications:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    low-stock-repeat-hours: ${LOW_STOCK_NOTIFICATION_REPEAT_HOURS:12}
    low-stock-reminder-ms: ${LOW_STOCK_NOTIFICATION_REMINDER_MS:43200000}
    low-stock-reminder-initial-delay-ms: ${LOW_STOCK_NOTIFICATION_REMINDER_INITIAL_DELAY_MS:43200000}
  security:
    max-failed-attempts: 5
    lock-time-duration: 5
    jwt:
      secret: ${JWT_SECRET}
  rest-countries:
    api-key: ${REST_COUNTRIES_API_KEY}
