# =============================================================================
# Render.com production profile
#
# Kích hoạt bằng env: SPRING_PROFILES_ACTIVE=render (xem render.yaml)
# File này merge đè lên application.yaml — chỉ override những gì cần thay đổi
# cho môi trường Render (free tier, ephemeral, no local DB).
#
# Khác biệt chính so với application.yaml:
#   * server.port  : dùng ${PORT} (Render inject, mặc định 10000) thay vì hardcode 8080
#   * ddl-auto     : 'none' — KHÔNG để Hibernate sinh DDL. Dùng schema-postgresql.sql
#                    qua Spring Boot sql.init → DataSourceScriptDatabaseInitializer
#                    (Spring Boot 3.5 tự động chạy TRƯỚC Hibernate JPA).
#   * sql.init     : 'always' + schema-locations classpath:schema-postgresql.sql
#                    → chạy full schema dump (49 tables, ENUMs, indexes, FKs).
#                    Idempotent (DROP IF EXISTS ở đầu file).
#   * multipart    : giữ nguyên 20MB từ application.yaml (đủ cho catalog import)
# =============================================================================

server:
  # Render set PORT env (thường là 10000 cho web service). Bind theo env.
  port: ${PORT:10000}
  # Bind trên 0.0.0.0 để Render health check detect được (mặc định localhost).
  address: 0.0.0.0

spring:
  # datasource: KHÔNG override ở đây — để application.yaml xử lý.
  # Render env inject DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME từ Database resource.
  # Nếu env thiếu, Spring Boot dùng default localhost:5432/osms (sẽ fail connect).

  jpa:
    hibernate:
      ddl-auto: none  # TẮT Hibernate DDL. Schema do schema-postgresql.sql tạo.
    show-sql: false
    defer-datasource-initialization: false  # ĐỂ SPRING BOOT chạy sql.init TRƯỚC Hibernate JPA (mặc định).
    properties:
      hibernate:
        # Hardcode dialect để tránh "Unable to determine Dialect" khi DB env
        # chưa được Render inject. Vẫn dùng Postgres ở Render.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # KHÔNG tạo enum types tự động — Hibernate 6 không generate CREATE TYPE cho @JdbcTypeCode(NAMED_ENUM).
        # Phải tạo enum qua schema-postgresql.sql.
        # format_sql: false

  main:
    banner-mode: off

  # ====================================================================
  # Spring Boot 3.5 sql.init → DataSourceScriptDatabaseInitializer
  # ====================================================================
  # Spring Boot TỰ ĐỘNG detect file schema-postgresql.sql ở classpath root
  # và chạy nó TRƯỚC khi Hibernate JPA tạo EntityManagerFactory.
  #
  # File schema-postgresql.sql (full schema dump từ hibernate-schema.sql):
  #   - DROP TABLE IF EXISTS ... (idempotent)
  #   - DROP TYPE IF EXISTS ... (idempotent)
  #   - CREATE TYPE ... ENUM (user_status, category_status, ...)
  #   - CREATE TABLE ... (49 tables với PK, FK, indexes)
  #   - CREATE OR REPLACE FUNCTION ... (triggers)
  #   - CREATE TRIGGER ...
  #   - INSERT ... (seed data) -- có thể bị sai pass nếu đã chạy trước
  #
  # continue-on-error: true → ON CONFLICT DO NOTHING / CREATE TABLE đã tồn tại OK.
  # mode: always → chạy mỗi lần deploy (Render có thể reset DB free tier).
  # ====================================================================
  sql:
    init:
      mode: always
      platform: postgresql
      schema-locations: classpath:schema-postgresql.sql
      data-locations:   # tắt data.sql mặc định
      continue-on-error: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    fu.osms: INFO
    # Log SQL script execution để dễ debug khi schema init fail
    org.springframework.jdbc.datasource.init: INFO
    org.springframework.boot.sql.init: INFO
