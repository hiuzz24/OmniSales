# =============================================================================
# Render.com production profile
#
# Kích hoạt bằng env: SPRING_PROFILES_ACTIVE=render (xem render.yaml)
# File này merge đè lên application.yaml — chỉ override những gì cần thay đổi
# cho môi trường Render (free tier, ephemeral, no local DB).
#
# Khác biệt chính so với application.yaml:
#   * server.port  : dùng ${PORT} (Render inject, mặc định 10000) thay vì hardcode 8080
#   * ddl-auto     : 'update' — Hibernate so sánh entity ↔ DB, CREATE TABLE nếu thiếu,
#                    ALTER TABLE nếu schema thay đổi. Phù hợp cho môi trường Render
#                    Postgres free tier (DB có thể bị reset, cần tạo lại tables).
#                    Lần deploy đầu vào DB trống sẽ tự tạo đủ 49 tables.
#                    Đổi sang 'none' sau khi schema ổn định nếu muốn dùng Flyway.
#   * banner-mode  : tắt banner cho log gọn (Render logs dễ đọc hơn)
#   * sql.init.mode: KHÔNG bật — schema/data đã được seed qua DatabaseMigration class
#                    (tránh Spring Boot tự load schema.sql gây conflict với Hibernate).
#   * multipart    : giữ nguyên 20MB từ application.yaml (đủ cho catalog import)
# =============================================================================

server:
  # Render set PORT env (thường là 10000 cho web service). Bind theo env.
  port: ${PORT:8080}

spring:
  # datasource: KHÔNG override ở đây — để application.yaml xử lý.
  # Render env inject DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME từ Database resource.
  # Nếu env thiếu, Spring Boot dùng default localhost:5432/osms (sẽ fail connect).

  jpa:
    hibernate:
      ddl-auto: create-drop  # DROP ALL tables mỗi lần restart + tạo lại từ entity. Tránh edge case khi DB có data cũ gây schema drift.
    show-sql: false
    defer-datasource-initialization: true  # Hibernate KHÔNG cần schema init (để schema.sql chạy SAU)
    properties:
      hibernate:
        # Hardcode dialect để tránh "Unable to determine Dialect" khi DB env
        # chưa được Render inject (npm run delete DB). Vẫn dùng Postgres ở Render.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # KHÔNG tạo enum types tự động — Hibernate 6 không generate CREATE TYPE cho @JdbcTypeCode(NAMED_ENUM).
        # Phải tạo enum qua sql.init.mode: always → schema-postgresql.sql.
        # format_sql: false

  main:
    banner-mode: off

  # Init PostgreSQL enum types TRƯỚC khi Hibernate ddl-auto tạo tables.
  # Vì entity dùng @JdbcTypeCode(SqlTypes.NAMED_ENUM) cần type đã tồn tại.
  # File schema-postgresql.sql dùng DO $$ ... duplicate_object → idempotent.
  sql:
    init:
      mode: always
      platform: postgresql
      continue-on-error: true   # type đã tồn tại → skip, không crash app
      # schema-locations mặc định: classpath:schema-${platform}.sql

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    fu.osms: INFO