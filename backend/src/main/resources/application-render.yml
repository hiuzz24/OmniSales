# =============================================================================
# Render.com production profile
#
# Kích hoạt bằng env: SPRING_PROFILES_ACTIVE=render (xem render.yaml)
# File này merge đè lên application.yaml — chỉ override những gì cần thay đổi
# cho môi trường Render (free tier, ephemeral, no local DB).
#
# Khác biệt chính so với application.yaml:
#   * server.port  : dùng ${PORT} (Render inject, mặc định 10000) thay vì hardcode 8080
#   * ddl-auto     : 'none' — schema đã được setup bởi init script (schema-postgresql.sql
#                    + DatabaseMigration Java). KHÔNG để Hibernate tự CREATE/ALTER
#                    vì sẽ fail với FK ordering trên DB trống.
#                    'update' trước đó tạo table nhưng FK sai thứ tự → ERROR relation does not exist.
#   * banner-mode  : tắt banner cho log gọn (Render logs dễ đọc hơn)
#   * sql.init.mode: KHÔNG bật — schema/data đã được seed qua DatabaseMigration class
#                    (tránh Spring Boot tự load schema.sql gây conflict với Hibernate).
#   * multipart    : giữ nguyên 20MB từ application.yaml (đủ cho catalog import)
# =============================================================================

server:
  # Render set PORT env (thường là 10000 cho web service). Bind theo env.
  port: ${PORT:8080}

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: false  # Hibernate KHÔNG cần schema init (để schema.sql chạy SAU)

  main:
    banner-mode: off

  # Init PostgreSQL enum types TRƯỚC khi Hibernate ddl-auto tạo tables.
  # Vì entity dùng @JdbcTypeCode(SqlTypes.NAMED_ENUM) cần type đã tồn tại.
  # File schema-postgresql.sql dùng DO $$ ... duplicate_object → idempotent.
  sql:
    init:
      mode: always
      platform: postgresql
      continue-on-error: true   # type đã tồn tại → skip, không crash app
      # schema-locations mặc định: classpath:schema-${platform}.sql

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    fu.osms: INFO