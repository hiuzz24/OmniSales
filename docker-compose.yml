version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: osms_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: OSMS
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d OSMS"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: osms_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-osms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-osms}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: osms_backend
    environment:
      - DB_URL=jdbc:postgresql://postgres_db:5432/OSMS
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - LAZADA_APP_KEY=${LAZADA_APP_KEY}
      - LAZADA_APP_SECRET=${LAZADA_APP_SECRET}
      - LAZADA_REDIRECT_URI=${LAZADA_REDIRECT_URI}
      - LAZADA_WEBHOOK_CALLBACK_URL=${LAZADA_WEBHOOK_CALLBACK_URL}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-osms}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-osms}
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: osms_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
