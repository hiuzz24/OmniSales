version: '3.8'

# =============================================================================
# OmniSales production stack
#
# Reads configuration from a project-root `.env` file (or shell env). Required
# variables are listed in `.env.example` next to this file.
#
# Usage:
#   docker compose --env-file .env up -d --build
# =============================================================================

services:
  postgres_db:
    image: postgres:15
    container_name: osms_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-OSMS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-seed the schema on first boot when the data volume is empty.
      # Subsequent boots skip these files because the database already exists.
      - ./backend/hibernate-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-OSMS}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: osms_backend
    environment:
      # Database
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-OSMS}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS:-604800000}
      # Frontend URL used by CORS / email links
      - FRONTEND_URL=${FRONTEND_URL}
      # Email
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - NOTIFICATION_EMAIL_ENABLED=${NOTIFICATION_EMAIL_ENABLED:-false}
      # Country API
      - REST_COUNTRIES_API_KEY=${REST_COUNTRIES_API_KEY}
      # Shopify
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_REDIRECT_URI=${SHOPIFY_REDIRECT_URI}
      - SHOPIFY_SCOPES=${SHOPIFY_SCOPES}
      - SHOPIFY_WEBHOOK_CALLBACK_URL=${SHOPIFY_WEBHOOK_CALLBACK_URL}
      # Lazada
      - LAZADA_APP_KEY=${LAZADA_APP_KEY}
      - LAZADA_APP_SECRET=${LAZADA_APP_SECRET}
      - LAZADA_REDIRECT_URI=${LAZADA_REDIRECT_URI}
      - LAZADA_WEBHOOK_CALLBACK_URL=${LAZADA_WEBHOOK_CALLBACK_URL}
      # TikTok
      - TIKTOK_APP_KEY=${TIKTOK_APP_KEY}
      - TIKTOK_APP_SECRET=${TIKTOK_APP_SECRET}
      - TIKTOK_TOKEN_URL=${TIKTOK_TOKEN_URL:-https://auth.tiktok-shops.com/api/v2/token/get}
      - TIKTOK_REFRESH_TOKEN_URL=${TIKTOK_REFRESH_TOKEN_URL:-https://auth.tiktok-shops.com/api/v2/token/refresh}
      - TIKTOK_API_URL=${TIKTOK_API_URL:-https://open-api.tiktokglobalshop.com}
      # Backup output directory (defaults to /app/backups inside the container)
      - APP_BACKUP_DIRECTORY=/app/backups
    volumes:
      - backup_data:/app/backups
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Injected at build time so the SPA can talk to the right backend in
        # production (defaults to /api which nginx proxies to the backend).
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-${FRONTEND_URL:-http://localhost}}
    container_name: osms_frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional HTTPS reverse proxy. Activated only when DOMAIN is set:
  #   docker compose --profile prod up -d
  # Bring the stack down without removing the proxy data volumes:
  #   docker compose --profile prod stop
  proxy:
    profiles: ["prod"]
    image: caddy:2-alpine
    container_name: osms_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-}
      - EMAIL=${EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_data: