<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swimlane Diagram - Order Process (OSMS)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      padding: 30px;
    }
    h1 { font-size: 20px; margin-bottom: 10px; color: #222; }
    p.note { font-size: 13px; color: #666; margin-bottom: 25px; }
    .diagram-wrap {
      background: white;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      margin-bottom: 40px;
    }
    svg text { font-family: Arial, Helvetica, sans-serif; }
    @media print {
      body { background: white; padding: 10px; }
      .diagram-wrap { box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<h1>Swimlane Diagram &mdash; Order Process (OSMS)</h1>
<p class="note">Based on code: WebhookController, WebhookReceiverServiceImpl, ShopifyOrderWebhookProcessor, LazadaOrderWebhookProcessor, OrderServiceImpl, OrderStatusPushService</p>

<div class="diagram-wrap"><svg id="d1"></svg></div>

<script>
var NS = 'http://www.w3.org/2000/svg';

function initSVG(el, w, h) {
  el.setAttribute('width', w);
  el.setAttribute('height', h);
  el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  var defs = document.createElementNS(NS, 'defs');
  var mk = document.createElementNS(NS, 'marker');
  mk.setAttribute('id', 'ah');
  mk.setAttribute('markerWidth', '8');
  mk.setAttribute('markerHeight', '6');
  mk.setAttribute('refX', '8');
  mk.setAttribute('refY', '3');
  mk.setAttribute('orient', 'auto');
  var pg = document.createElementNS(NS, 'polygon');
  pg.setAttribute('points', '0 0,8 3,0 6');
  pg.setAttribute('fill', '#333');
  mk.appendChild(pg);
  defs.appendChild(mk);
  el.appendChild(defs);
}

function drawRect(svg, x, y, w, h, fill, stroke, sw, rx) {
  var r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', x); r.setAttribute('y', y);
  r.setAttribute('width', w); r.setAttribute('height', h);
  r.setAttribute('fill', fill || 'white');
  r.setAttribute('stroke', stroke || '#333');
  r.setAttribute('stroke-width', sw || 1.5);
  if (rx) r.setAttribute('rx', rx);
  svg.appendChild(r);
}

function txt(svg, x, y, str, sz, fw, anchor, fill) {
  var t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('text-anchor', anchor || 'middle');
  t.setAttribute('dominant-baseline', 'central');
  t.setAttribute('font-size', sz || 11);
  t.setAttribute('fill', fill || '#333');
  if (fw) t.setAttribute('font-weight', fw);
  t.textContent = str;
  svg.appendChild(t);
}

function drawLine(svg, x1, y1, x2, y2, dash) {
  var l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('stroke', '#333'); l.setAttribute('stroke-width', 1);
  if (dash) l.setAttribute('stroke-dasharray', dash);
  svg.appendChild(l);
}

function setupLanes(svg, title, lanes, laneW, totalH) {
  var totalW = lanes.length * laneW;
  drawRect(svg, 0, 0, totalW, 32, '#e8e8e8', '#333', 1.5);
  txt(svg, totalW / 2, 16, title, 13, 'bold');
  for (var i = 0; i < lanes.length; i++) {
    drawRect(svg, i * laneW, 32, laneW, 30, '#f5f5f5', '#333', 1);
    txt(svg, i * laneW + laneW / 2, 47, lanes[i], 12, 'bold');
  }
  for (var i = 1; i < lanes.length; i++) {
    drawLine(svg, i * laneW, 62, i * laneW, totalH);
  }
  drawRect(svg, 0, 0, totalW, totalH, 'none', '#333', 2);
}

function proc(svg, cx, cy, lines, w, h) {
  w = w || 140;
  var lh = 14;
  h = h || Math.max(32, lines.length * lh + 10);
  drawRect(svg, cx - w/2, cy - h/2, w, h, 'white', '#333', 1.3, 3);
  var sy = cy - ((lines.length - 1) * lh) / 2;
  for (var i = 0; i < lines.length; i++) txt(svg, cx, sy + i * lh, lines[i], 11);
  return { cx:cx, cy:cy, w:w, h:h,
    t:[cx, cy-h/2], b:[cx, cy+h/2], l:[cx-w/2, cy], r:[cx+w/2, cy] };
}

function dec(svg, cx, cy, lines, w, h) {
  w = w || 120; h = h || 70;
  var hw = w/2, hh = h/2;
  var p = document.createElementNS(NS, 'polygon');
  p.setAttribute('points', cx+','+(cy-hh)+' '+(cx+hw)+','+cy+' '+cx+','+(cy+hh)+' '+(cx-hw)+','+cy);
  p.setAttribute('fill', 'white');
  p.setAttribute('stroke', '#333');
  p.setAttribute('stroke-width', '1.3');
  svg.appendChild(p);
  var lh = 13;
  var sy = cy - ((lines.length - 1) * lh) / 2;
  for (var i = 0; i < lines.length; i++) txt(svg, cx, sy + i * lh, lines[i], 10);
  return { cx:cx, cy:cy, w:w, h:h,
    t:[cx, cy-hh], b:[cx, cy+hh], l:[cx-hw, cy], r:[cx+hw, cy] };
}

function startN(svg, cx, cy) {
  var r = 20;
  var c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
  c.setAttribute('fill', 'white'); c.setAttribute('stroke', '#333'); c.setAttribute('stroke-width', '1.5');
  svg.appendChild(c);
  txt(svg, cx, cy, 'Start', 10);
  return { cx:cx, cy:cy, r:r, t:[cx,cy-r], b:[cx,cy+r], l:[cx-r,cy], r:[cx+r,cy] };
}

function endN(svg, cx, cy) {
  var ro = 13, ri = 7;
  var co = document.createElementNS(NS, 'circle');
  co.setAttribute('cx', cx); co.setAttribute('cy', cy); co.setAttribute('r', ro);
  co.setAttribute('fill', 'white'); co.setAttribute('stroke', '#333'); co.setAttribute('stroke-width', '2');
  svg.appendChild(co);
  var ci = document.createElementNS(NS, 'circle');
  ci.setAttribute('cx', cx); ci.setAttribute('cy', cy); ci.setAttribute('r', ri);
  ci.setAttribute('fill', '#333');
  svg.appendChild(ci);
  return { cx:cx, cy:cy, r:ro, t:[cx,cy-ro], b:[cx,cy+ro], l:[cx-ro,cy], r:[cx+ro,cy] };
}

function connN(svg, cx, cy) {
  var r = 9;
  var c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
  c.setAttribute('fill', 'white'); c.setAttribute('stroke', '#333'); c.setAttribute('stroke-width', '1.3');
  svg.appendChild(c);
  return { cx:cx, cy:cy, r:r, t:[cx,cy-r], b:[cx,cy+r], l:[cx-r,cy], r:[cx+r,cy] };
}

function arr(svg, pts, label, lx, ly, lanchor) {
  var pl = document.createElementNS(NS, 'polyline');
  var pstr = '';
  for (var i = 0; i < pts.length; i++) {
    if (i > 0) pstr += ' ';
    pstr += pts[i][0] + ',' + pts[i][1];
  }
  pl.setAttribute('points', pstr);
  pl.setAttribute('fill', 'none');
  pl.setAttribute('stroke', '#333');
  pl.setAttribute('stroke-width', '1.2');
  pl.setAttribute('marker-end', 'url(#ah)');
  svg.appendChild(pl);
  if (label && lx != null) txt(svg, lx, ly, label, 10, null, lanchor || 'middle');
}

function phaseLabel(svg, totalW, y, label) {
  drawLine(svg, 0, y, totalW, y, '6,3');
  drawRect(svg, totalW / 2 - 70, y - 10, 140, 20, '#e8e8e8', '#999', 0.8, 3);
  txt(svg, totalW / 2, y, label, 10, 'bold', 'middle', '#555');
}


/* ============================================================
   COMBINED DIAGRAM
   Lanes: Shopify / Lazada | OSMS | Store Owner
   Phase 1: Receive Order via Webhook
   Phase 2: Manage Order (Update Status / Cancel)
   ============================================================ */
(function() {
  var s = document.getElementById('d1');
  var LW = 300, H = 3120;
  initSVG(s, LW * 3, H);
  setupLanes(s, 'Order Process', ['Shopify / Lazada', 'OSMS', 'Store Owner'], LW, H);

  var L1 = 150, L2 = 450, L3 = 750;
  var Y = 62;

  /* ========== PHASE 1: RECEIVE ORDER ========== */
  phaseLabel(s, LW * 3, Y + 10, 'Phase 1: Receive Order via Webhook');

  var nStart    = startN(s, L1, Y + 50);
  var nCustOrd  = proc(s, L1, Y + 120, ['Customer places', 'order on platform']);
  var nSendWH   = proc(s, L1, Y + 200, ['Platform sends', 'webhook to OSMS']);

  var nReceive  = proc(s, L2, Y + 285, ['WebhookController', 'receives POST request']);
  var nVerify   = proc(s, L2, Y + 365, ['Verify webhook', 'signature']);
  var nVerifyQ  = dec(s, L2, Y + 450, ['Signature', 'valid?']);
  var nReject   = proc(s, L2 - 85, Y + 540, ['Return 401', 'Unauthorized'], 115);
  var nEndRej   = endN(s, L2 - 85, Y + 600);

  var nParse    = proc(s, L2, Y + 545, ['Parse payload &', 'extract event type']);
  var nDupQ     = dec(s, L2, Y + 630, ['Duplicate', 'event?']);
  var nIgnore   = proc(s, L2 - 75, Y + 720, ['Return duplicate', 'ignored response'], 120);
  var nEndIgn   = endN(s, L2 - 75, Y + 780);

  var nResolve  = proc(s, L2 + 70, Y + 725, ['Resolve channel', '& save WebhookEvent']);
  var nChannelQ = dec(s, L2 + 70, Y + 810, ['Channel', 'resolved?']);
  var nFailedCh = proc(s, L2 - 85, Y + 900, ['Status = FAILED', 'Cannot resolve channel'], 125);
  var nEndFail  = endN(s, L2 - 85, Y + 960);
  var nOrderQ   = dec(s, L2 + 70, Y + 910, ['Event type', 'is ORDER?']);
  var nIgnore2  = proc(s, L2 - 85, Y + 1010, ['Status =', 'IGNORED'], 100);
  var nEndIgn2  = endN(s, L2 - 85, Y + 1070);

  var nProcess  = proc(s, L2 + 70, Y + 1010, ['Process order:', 'ensureOrder, resolve', 'status & items'], 150, 55);
  var nSaveWH   = proc(s, L2 + 70, Y + 1100, ['Save Order &', 'OrderItems to DB']);
  var nStatus   = proc(s, L2 + 70, Y + 1175, ['Status =', 'PROCESSED']);
  var nReturnOK = proc(s, L2 + 70, Y + 1250, ['Return 200 OK', 'Webhook processed'], 130);
  var nEndOk    = endN(s, L2 + 70, Y + 1315);

  // Phase 1 connections
  arr(s, [nStart.b, nCustOrd.t]);
  arr(s, [nCustOrd.b, nSendWH.t]);
  arr(s, [nSendWH.r, [L2, nSendWH.cy], nReceive.t]);
  arr(s, [nReceive.b, nVerify.t]);
  arr(s, [nVerify.b, nVerifyQ.t]);

  arr(s, [nVerifyQ.l, [nReject.cx, nVerifyQ.cy], nReject.t],
    'No', L2 - 55, Y + 440, 'end');
  arr(s, [nReject.b, nEndRej.t]);
  arr(s, [nVerifyQ.b, nParse.t], 'Yes', L2 + 15, Y + 500, 'start');

  arr(s, [nParse.b, nDupQ.t]);
  arr(s, [nDupQ.l, [nIgnore.cx, nDupQ.cy], nIgnore.t],
    'Yes', L2 - 45, Y + 655, 'end');
  arr(s, [nIgnore.b, nEndIgn.t]);
  arr(s, [nDupQ.r, [nResolve.cx, nDupQ.cy], nResolve.t],
    'No', L2 + 95, Y + 655, 'start');

  arr(s, [nResolve.b, nChannelQ.t]);
  arr(s, [nChannelQ.l, [nFailedCh.cx, nChannelQ.cy], nFailedCh.t],
    'No', L2 - 45, Y + 835, 'end');
  arr(s, [nFailedCh.b, nEndFail.t]);
  arr(s, [nChannelQ.b, nOrderQ.t], 'Yes', L2 + 85, Y + 860, 'start');

  arr(s, [nOrderQ.l, [nIgnore2.cx, nOrderQ.cy], nIgnore2.t],
    'No', L2 - 45, Y + 935, 'end');
  arr(s, [nIgnore2.b, nEndIgn2.t]);
  arr(s, [nOrderQ.b, nProcess.t], 'Yes', L2 + 85, Y + 962, 'start');

  arr(s, [nProcess.b, nSaveWH.t]);
  arr(s, [nSaveWH.b, nStatus.t]);
  arr(s, [nStatus.b, nReturnOK.t]);
  arr(s, [nReturnOK.b, nEndOk.t]);


  /* ========== PHASE 2: MANAGE ORDER ========== */
  var P2 = Y + 260;
  phaseLabel(s, LW * 3, P2 + 1140, 'Phase 2: Manage Order (Update Status / Cancel)');

  var nSOSelect = proc(s, L3, P2 + 1190, ['Select order from', 'order list']);
  var nSOAction = dec(s, L3, P2 + 1280, ['Choose', 'action?']);
  var nSOStatus = proc(s, 690, P2 + 1385, ['Choose new', 'status'], 110);
  var nLazadaQ = dec(s, L2 + 100, P2 + 1445, ['Lazada', 'order?'], 95, 60);
  var nGetReason = proc(s, L2 + 100, P2 + 1535, ['Request cancel', 'reasons']);
  var nValidateCancel = proc(s, L1, P2 + 1535, ['Validate cancel', 'reasons API'], 125);
  var nSOCancel = proc(s, 810, P2 + 1535, ['Select reason', '/ enter note'], 115);
  var nSOMerge  = connN(s, L3, P2 + 1620);

  var nValid    = proc(s, L2, P2 + 1700, ['Validate', 'transition rules']);
  var nValidQ   = dec(s, L2, P2 + 1785, ['Valid?'], 100, 60);
  var nErrV     = proc(s, L3, P2 + 1785, ['Show', 'error'], 90);
  var nEndV     = endN(s, L3, P2 + 1850);

  var nPlatQ    = dec(s, L2, P2 + 1890, ['Platform', 'order?']);
  var nPush     = proc(s, L2, P2 + 2000, ['Dispatch status', 'pusher strategy']);

  // Platform lane
  var nCallAPI  = proc(s, L1, P2 + 2000, ['If supported:', 'call platform API', '(pack/rts/fulfill/cancel)'], 160);
  var nRet      = proc(s, L1, P2 + 2100, ['Return SUCCESS /', 'SKIPPED / FAILED'], 140);

  var nPushQ    = dec(s, L2, P2 + 2180, ['Allow local', 'update?'], 100, 60);
  var nBlock    = proc(s, L2 + 165, P2 + 2180, ['Return error', 'keep local status'], 120);
  var nEndB     = endN(s, L2 + 165, P2 + 2250);

  var nCancelQ  = dec(s, L2, P2 + 2290, ['Is cancel', 'action?']);
  var nRelInv   = proc(s, L2, P2 + 2390, ['Release reserved', 'inventory']);
  var nUpd      = proc(s, L2, P2 + 2480, ['Update order', 'status locally']);
  var nDelQ     = dec(s, L2, P2 + 2565, ['Manual delivered', '& UNPAID?']);
  var nAuto     = proc(s, L2 + 120, P2 + 2565, ['Set payment', 'PAID'], 105);
  var nSave2    = proc(s, L2, P2 + 2660, ['Save order']);
  var nAudit    = proc(s, L2, P2 + 2730, ['Record', 'audit log']);
  var nEndAll   = endN(s, L2, P2 + 2790);

  // Phase 2 connections

  arr(s, [nSOSelect.b, nSOAction.t]);
  arr(s, [nSOAction.b, [L3, P2+1335], [690, P2+1335], nSOStatus.t],
    'Update', 665, P2 + 1348, 'end');
  arr(s, [nSOAction.l, [nLazadaQ.cx, nSOAction.cy], nLazadaQ.t],
    'Cancel', 610, P2 + 1270, 'end');
  arr(s, [nLazadaQ.b, nGetReason.t], 'Yes', nLazadaQ.cx + 15, P2 + 1490, 'start');
  arr(s, [nLazadaQ.r, [nSOCancel.cx, nLazadaQ.cy], nSOCancel.t],
    'No / Shopify', 690, P2 + 1428, 'middle');
  arr(s, [nGetReason.l, nValidateCancel.r],
    'Call Lazada API', 350, P2 + 1518, 'middle');
  arr(s, [nValidateCancel.b, [nValidateCancel.cx, P2 + 1595], [nGetReason.cx, P2 + 1595], nGetReason.b],
    'Reason options', 350, P2 + 1610, 'middle');
  arr(s, [nGetReason.r, nSOCancel.l]);

  arr(s, [nSOStatus.b, [690, nSOMerge.cy], nSOMerge.l]);
  arr(s, [nSOCancel.b, [810, nSOMerge.cy], nSOMerge.r]);

  arr(s, [[nSOMerge.cx, nSOMerge.cy + nSOMerge.r],
    [nSOMerge.cx, P2 + 1660], [L2, P2 + 1660], nValid.t]);

  arr(s, [nValid.b, nValidQ.t]);
  arr(s, [nValidQ.r, nErrV.l], 'No', 620, P2 + 1775, 'middle');
  arr(s, [nErrV.b, nEndV.t]);
  arr(s, [nValidQ.b, nPlatQ.t], 'Yes', L2 + 15, P2 + 1842, 'start');

  // Platform order? Yes -> push
  arr(s, [nPlatQ.b, nPush.t], 'Yes', L2 + 15, P2 + 1950, 'start');
  // No -> bypass to cancelQ
  arr(s, [nPlatQ.l, [L2 - 140, nPlatQ.cy], [L2 - 140, nCancelQ.cy], nCancelQ.l],
    'No', L2 - 153, P2 + 1910, 'end');

  // Push -> Platform API
  arr(s, [nPush.l, nCallAPI.r]);
  arr(s, [nCallAPI.b, nRet.t]);
  arr(s, [nRet.r, [L2, nRet.cy], [L2, P2 + 2145], nPushQ.t]);

  // Push OK?
  arr(s, [nPushQ.r, nBlock.l], 'No', 655, P2 + 2170, 'middle');
  arr(s, [nBlock.b, nEndB.t]);
  arr(s, [nPushQ.b, nCancelQ.t], 'Yes', L2 + 15, P2 + 2242, 'start');

  // Is cancel?
  arr(s, [nCancelQ.b, nRelInv.t], 'Yes', L2 + 15, P2 + 2342, 'start');
  arr(s, [nCancelQ.r, [L2 + 105, nCancelQ.cy], [L2 + 105, nUpd.cy], nUpd.r],
    'No', L2 + 118, P2 + 2313, 'start');

  arr(s, [nRelInv.b, nUpd.t]);
  arr(s, [nUpd.b, nDelQ.t]);

  // Manual delivered & unpaid?
  arr(s, [nDelQ.r, nAuto.l], 'Yes', 620, P2 + 2555, 'middle');
  arr(s, [nDelQ.b, nSave2.t], 'No', L2 + 15, P2 + 2615, 'start');
  arr(s, [nAuto.b, [nAuto.cx, P2 + 2660], nSave2.r]);

  arr(s, [nSave2.b, nAudit.t]);
  arr(s, [nAudit.b, nEndAll.t]);
})();

</script>
</body>
</html>
